<!doctype html>
<html lang="pt-PT">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Painel — Jo Torres Imobiliário
</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<style>

:root {
  --gold:#d4a72c;
  --dark:#07171b;
  --bg:#f5f6f7;
  --text:#172126;
  --muted:#6b7280;
  --border:#e1e5e7;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:var(--bg);

  color:var(--text);
}

button,
input,
select,
textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

input,
select,
textarea {
  width:100%;

  padding:12px;

  border:1px solid #d8dde0;

  border-radius:10px;

  background:#fff;

  color:var(--text);
}

textarea {
  min-height:130px;
  resize:vertical;
}

.login {
  min-height:100vh;

  display:grid;

  place-items:center;

  padding:20px;
}

.login-card,
.modal-card,
.card {
  background:#fff;

  border-radius:18px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.07);
}

.login-card {
  width:min(420px,100%);

  padding:30px;
}

label {
  display:block;

  font-size:13px;

  font-weight:700;

  margin:15px 0 7px;
}

.primary {
  background:var(--gold);

  color:white;

  border:0;

  border-radius:10px;

  padding:12px 18px;

  font-weight:700;
}

.secondary {
  background:#eef1f2;

  color:var(--text);

  border:0;

  border-radius:10px;

  padding:11px 15px;

  font-weight:700;
}

.danger {
  background:#fee;

  color:#b52b22;

  border:0;

  border-radius:10px;

  padding:10px 14px;

  font-weight:700;
}

.app {
  display:none;
}

.top {
  min-height:72px;

  background:var(--dark);

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 28px;
}

.top small {
  display:block;

  color:var(--gold);

  margin-top:4px;
}

.layout {
  display:grid;

  grid-template-columns:250px 1fr;

  min-height:calc(100vh - 72px);
}

.side {
  background:#fff;

  padding:20px;

  border-right:1px solid #e5e7e9;
}

.side button {
  width:100%;

  margin-bottom:8px;

  text-align:left;
}

.content {
  padding:28px;

  max-width:1250px;

  width:100%;

  margin:auto;
}

.head {
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;
}

.grid {
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(270px,1fr));

  gap:18px;
}

.card {
  overflow:hidden;

  border:1px solid #e8eaec;
}

.thumb {
  height:200px;

  background:#e9edef;
}

.thumb img {
  width:100%;
  height:100%;

  object-fit:cover;
}

.body {
  padding:16px;
}

.price {
  font-weight:800;

  font-size:19px;

  margin:9px 0;
}

.muted {
  color:var(--muted);

  font-size:14px;
}

.actions {
  display:flex;

  gap:8px;

  margin-top:14px;
}

.actions button {
  flex:1;
}

.modal {
  display:none;

  position:fixed;

  inset:0;

  background:#07171b99;

  padding:20px;

  overflow:auto;

  z-index:5;
}

.modal-card {
  max-width:800px;

  margin:30px auto;

  padding:25px;
}

.modal-head {
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.form-grid {
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:0 15px;
}

.full {
  grid-column:1/-1;
}

.checkbox-grid {
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:10px;
}

.check-card {
  padding:14px;

  border:1px solid var(--border);

  border-radius:10px;

  background:#fafafa;

  cursor:pointer;
}

.check-card input {
  width:auto;

  margin-right:8px;
}

.photos {
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(110px,1fr));

  gap:10px;

  margin-top:10px;
}

.photo {
  height:100px;

  position:relative;

  border-radius:10px;

  overflow:hidden;

  background:#eee;
}

.photo img {
  width:100%;
  height:100%;

  object-fit:cover;
}

.photo button {
  position:absolute;

  right:4px;
  top:4px;

  border:0;

  border-radius:50%;

  width:25px;
  height:25px;

  cursor:pointer;
}

.filebox {
  border:2px dashed #d5dadd;

  padding:18px;

  text-align:center;

  border-radius:12px;
}

.msg {
  padding:11px;

  border-radius:10px;

  margin:10px 0;

  background:#fff0f0;

  color:#9d2b23;
}

.empty {
  background:#fff;

  border-radius:16px;

  padding:40px;

  text-align:center;

  color:var(--muted);
}

@media(max-width:800px) {

  .layout {
    grid-template-columns:1fr;
  }

  .side {
    display:none;
  }

  .content {
    padding:18px;
  }

  .form-grid {
    grid-template-columns:1fr;
  }

  .full {
    grid-column:auto;
  }

  .head {
    flex-direction:column;

    align-items:flex-start;

    gap:10px;
  }

  .checkbox-grid {
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<section id="login" class="login">

  <div class="login-card">

    <h2 style="margin:0">
      JO
      <span style="color:#d4a72c">
        TORRES
      </span>
    </h2>

    <p>
      Consultor Imobiliário · Painel de gestão
    </p>


    <form id="loginForm">

      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        required
      >


      <label>
        Palavra-passe
      </label>

      <input
        id="password"
        type="password"
        required
      >


      <button
        class="primary"
        style="width:100%;margin-top:20px"
      >
        Entrar
      </button>

    </form>


    <div
      id="loginMsg"
      class="msg"
      style="display:none"
    ></div>

  </div>

</section>


<section id="app" class="app">


<header class="top">

  <div>

    <b>
      JO TORRES
    </b>

    <small>
      PAINEL DE GESTÃO
    </small>

  </div>

  <button
    id="logout"
    class="secondary"
  >
    Sair
  </button>

</header>


<div class="layout">


<aside class="side">

  <button
    class="secondary"
    onclick="openNew()"
  >
    <i class="fa-solid fa-plus"></i>
    Novo imóvel
  </button>


  <button
    class="secondary"
    onclick="loadProperties()"
  >
    <i class="fa-solid fa-house"></i>
    Imóveis
  </button>

</aside>


<main class="content">


<div class="head">

  <div>

    <h1 style="margin:0">
      Imóveis
    </h1>

    <p class="muted">
      Gerir os imóveis publicados no site.
    </p>

  </div>


  <button
    class="primary"
    onclick="openNew()"
  >
    <i class="fa-solid fa-plus"></i>
    Adicionar imóvel
  </button>

</div>


<div
  id="properties"
  class="grid"
></div>


</main>

</div>

</section>


<div
  id="modal"
  class="modal"
>

<div class="modal-card">


<div class="modal-head">

  <h2 id="modalTitle">
    Novo imóvel
  </h2>

  <button
    class="secondary"
    onclick="closeModal()"
  >
    Fechar
  </button>

</div>


<form id="propertyForm">


<input
  id="propertyId"
  type="hidden"
>


<div class="form-grid">


<div class="full">

<label>
  Título
</label>

<input
  id="titulo"
  required
  placeholder="Moradia moderna com jardim"
>

</div>


<div>

<label>
  Tipo
</label>

<select id="tipo">

  <option>Moradia</option>
  <option>Apartamento</option>
  <option>Villa</option>
  <option>Terreno</option>
  <option>Comercial</option>
  <option>Outro</option>

</select>

</div>


<div>

<label>
  Localização
</label>

<input
  id="localizacao"
  required
>

</div>


<div>

<label>
  Preço (€)
</label>

<input
  id="preco"
  type="number"
  min="0"
  step="0.01"
>

</div>


<div>

<label>
  Área (m²)
</label>

<input
  id="area"
  type="number"
  min="0"
  step="0.01"
>

</div>


<div>

<label>
  Quartos
</label>

<input
  id="quartos"
  type="number"
  min="0"
>

</div>


<div>

<label>
  Casas de banho
</label>

<input
  id="casas_banho"
  type="number"
  min="0"
>

</div>


<div>

<label>
  Estado
</label>

<select id="estado">

  <option>Disponível</option>
  <option>Reservado</option>
  <option>Vendido</option>
  <option>Arrendado</option>

</select>

</div>


<div class="full">

<label>
  Características
</label>


<div class="checkbox-grid">


<label class="check-card">

  <input
    id="garagem"
    type="checkbox"
  >

  <i class="fa-solid fa-car"></i>

  Garagem

</label>


<label class="check-card">

  <input
    id="piscina"
    type="checkbox"
  >

  <i class="fa-solid fa-person-swimming"></i>

  Piscina

</label>


<label class="check-card">

  <input
    id="luxo"
    type="checkbox"
  >

  <i class="fa-solid fa-gem"></i>

  Imóvel de luxo

</label>


</div>

</div>


<div class="full">

<label>
  Link do imóvel na FNAI
</label>

<input
  id="fnai_url"
  type="url"
  placeholder="https://www.fnai.pt/..."
>

<p class="muted">
  Cole aqui o link direto deste imóvel na FNAI.
</p>

</div>


<div class="full">

<label>
  Descrição
</label>

<textarea
  id="descricao"
></textarea>

</div>


<div class="full">

<label>
  Fotografias
</label>


<div class="filebox">

<input
  id="photos"
  type="file"
  accept="image/jpeg,image/png,image/webp,image/gif"
  multiple
>

<p class="muted">
  Selecione várias imagens.
  Máximo 10 MB por imagem.
</p>

</div>


<div
  id="photoPreview"
  class="photos"
></div>

</div>


<div class="full">

<label>

<input
  id="publicado"
  type="checkbox"
  style="width:auto"
>

 Publicar este imóvel

</label>

</div>


</div>


<div
  style="
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:22px
  "
>

<button
  type="button"
  class="secondary"
  onclick="closeModal()"
>
  Cancelar
</button>


<button
  class="primary"
>
  Guardar imóvel
</button>

</div>


</form>

</div>

</div>


<script>

const SUPABASE_URL =
  'https://scmorocdbdyvnxodpwyi.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentPhotos = [];

let newFiles = [];


const $ =
  id =>
  document.getElementById(id);


function esc(value) {

  return String(value ?? '')
    .replace(/[&<>"']/g, function(char) {

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[char];

    });

}


function msg(text) {

  $('loginMsg').textContent =
    text;

  $('loginMsg').style.display =
    'block';

}


async function init() {

  const sessionResult =
    await sb.auth.getSession();

  if (sessionResult.data.session) {

    showApp();

  }

}


$('loginForm').onsubmit =
async function(event) {

  event.preventDefault();


  const result =
    await sb.auth.signInWithPassword({

      email:$('email').value,

      password:$('password').value

    });


  if (result.error) {

    msg(result.error.message);

    return;

  }


  showApp();

};


$('logout').onclick =
async function() {

  await sb.auth.signOut();

  location.reload();

};


function showApp() {

  $('login').style.display =
    'none';

  $('app').style.display =
    'block';

  loadProperties();

}


function formatPrice(price) {

  if (!price) {
    return 'Preço sob consulta';
  }

  return new Intl.NumberFormat(
    'pt-PT',
    {
      style:'currency',
      currency:'EUR',
      maximumFractionDigits:0
    }
  ).format(price);

}


async function loadProperties() {

  const box =
    $('properties');

  box.innerHTML =
    '<div class="empty">A carregar...</div>';


  const result =
    await sb
      .from('imoveis')
      .select('*')
      .order('created_at', {
        ascending:false
      });


  if (result.error) {

    box.innerHTML =
      '<div class="empty">Erro: ' +
      esc(result.error.message) +
      '</div>';

    return;

  }


  const data =
    result.data || [];


  if (!data.length) {

    box.innerHTML =
      '<div class="empty">' +
      'Ainda não existem imóveis.' +
      '</div>';

    return;

  }


  box.innerHTML =
    data.map(function(p) {

      return `

        <article class="card">

          <div class="thumb">

            ${
              p.imagem_capa
              ?
              `<img
                src="${esc(p.imagem_capa)}"
                alt="${esc(p.titulo)}"
              >`
              :
              ''
            }

          </div>


          <div class="body">

            <h3>
              ${esc(p.titulo)}
            </h3>


            <div class="muted">

              <i class="fa-solid fa-location-dot"></i>

              ${esc(p.localizacao)}

            </div>


            <div class="price">
              ${formatPrice(p.preco)}
            </div>


            <div class="muted">

              ${
                p.area
                ?
                `${p.area} m² · `
                : ''
              }

              ${
                p.quartos || 0
              }
              quartos ·

              ${
                p.casas_banho || 0
              }
              WC

              ${
                p.garagem
                ? ' · Garagem'
                : ''
              }

              ${
                p.piscina
                ? ' · Piscina'
                : ''
              }

              ${
                p.luxo
                ? ' · Luxo'
                : ''
              }

            </div>


            <div class="muted">

              ${
                p.publicado
                ? 'Publicado'
                : 'Rascunho'
              }

            </div>


            <div class="actions">

              <button
                class="secondary"
                onclick="editProperty('${p.id}')"
              >
                Editar
              </button>


              <button
                class="danger"
                onclick="deleteProperty('${p.id}')"
              >
                Eliminar
              </button>

            </div>

          </div>

        </article>

      `;

    }).join('');

}


function openNew() {

  $('propertyForm').reset();

  $('propertyId').value =
    '';

  $('modalTitle').textContent =
    'Novo imóvel';

  currentPhotos = [];

  newFiles = [];

  renderPhotos();

  $('modal').style.display =
    'block';

}


function closeModal() {

  $('modal').style.display =
    'none';

}


async function editProperty(id) {

  const result =
    await sb
      .from('imoveis')
      .select('*')
      .eq('id', id)
      .single();


  if (result.error) {

    alert(result.error.message);

    return;

  }


  const p =
    result.data;


  $('propertyId').value =
    id;

  $('modalTitle').textContent =
    'Editar imóvel';


  $('titulo').value =
    p.titulo || '';

  $('tipo').value =
    p.tipo || 'Moradia';

  $('localizacao').value =
    p.localizacao || '';

  $('preco').value =
    p.preco ?? '';

  $('area').value =
    p.area ?? '';

  $('quartos').value =
    p.quartos ?? 0;

  $('casas_banho').value =
    p.casas_banho ?? 0;

  $('estado').value =
    p.estado || 'Disponível';

  $('descricao').value =
    p.descricao || '';

  $('publicado').checked =
    !!p.publicado;

  $('garagem').checked =
    !!p.garagem;

  $('piscina').checked =
    !!p.piscina;

  $('luxo').checked =
    !!p.luxo;

  $('fnai_url').value =
    p.fnai_url || '';


  const photos =
    await sb
      .from('imovel_fotos')
      .select('*')
      .eq('imovel_id', id)
      .order('ordem', {
        ascending:true
      });


  currentPhotos =
    photos.data || [];

  newFiles = [];


  renderPhotos();


  $('modal').style.display =
    'block';

}


$('photos').onchange =
function(event) {

  newFiles =
    [
      ...event.target.files
    ];

  renderPhotos();

};


function renderPhotos() {

  $('photoPreview').innerHTML =
    '';


  currentPhotos.forEach(
    function(photo,index) {

      const d =
        document.createElement('div');

      d.className =
        'photo';


      d.innerHTML = `

        <img
          src="${esc(photo.url)}"
          alt=""
        >

        <button
          type="button"
        >
          ×
        </button>

      `;


      d.querySelector('button')
        .onclick =
        function() {

          removePhoto(index);

        };


      $('photoPreview')
        .appendChild(d);

    }
  );


  newFiles.forEach(
    function(file,index) {

      const d =
        document.createElement('div');

      d.className =
        'photo';


      const image =
        document.createElement('img');

      image.src =
        URL.createObjectURL(file);


      const button =
        document.createElement('button');

      button.type =
        'button';

      button.textContent =
        '×';


      button.onclick =
        function() {

          newFiles.splice(
            index,
            1
          );

          renderPhotos();

        };


      d.append(
        image,
        button
      );


      $('photoPreview')
        .appendChild(d);

    }
  );

}


async function removePhoto(index) {

  if (
    !confirm(
      'Eliminar esta fotografia?'
    )
  ) {
    return;
  }


  const photo =
    currentPhotos[index];


  const storage =
    await sb
      .storage
      .from('imoveis')
      .remove([
        photo.storage_path
      ]);


  if (storage.error) {

    alert(storage.error.message);

    return;

  }


  const database =
    await sb
      .from('imovel_fotos')
      .delete()
      .eq('id', photo.id);


  if (database.error) {

    alert(database.error.message);

    return;

  }


  currentPhotos.splice(
    index,
    1
  );


  renderPhotos();

}


$('propertyForm').onsubmit =
async function(event) {

  event.preventDefault();


  const id =
    $('propertyId').value;


  const payload = {

    titulo:
      $('titulo').value.trim(),

    tipo:
      $('tipo').value,

    localizacao:
      $('localizacao').value.trim(),

    preco:
      Number($('preco').value) || null,

    area:
      Number($('area').value) || null,

    quartos:
      Number($('quartos').value) || 0,

    casas_banho:
      Number($('casas_banho').value) || 0,

    estado:
      $('estado').value,

    descricao:
      $('descricao').value.trim(),

    garagem:
      $('garagem').checked,

    piscina:
      $('piscina').checked,

    luxo:
      $('luxo').checked,

    fnai_url:
      $('fnai_url').value.trim() || null,

    publicado:
      $('publicado').checked

  };


  let propertyId =
    id;


  if (id) {

    const result =
      await sb
        .from('imoveis')
        .update(payload)
        .eq('id', id);


    if (result.error) {

      alert(result.error.message);

      return;

    }

  } else {

    const result =
      await sb
        .from('imoveis')
        .insert(payload)
        .select()
        .single();


    if (result.error) {

      alert(result.error.message);

      return;

    }


    propertyId =
      result.data.id;

  }


  let order =
    currentPhotos.length;


  for (const file of newFiles) {

    if (
      file.size >
      10 * 1024 * 1024
    ) {

      alert(
        file.name +
        ' ultrapassa 10 MB.'
      );

      continue;

    }


    const safe =
      file.name
        .toLowerCase()
        .replace(
          /[^a-z0-9._-]/g,
          '-'
        );


    const path =
      propertyId +
      '/' +
      crypto.randomUUID() +
      '-' +
      safe;


    const upload =
      await sb
        .storage
        .from('imoveis')
        .upload(
          path,
          file,
          {
            contentType:
              file.type,

            upsert:false
          }
        );


    if (upload.error) {

      alert(
        'Upload: ' +
        upload.error.message
      );

      continue;

    }


    const publicUrl =
      sb
        .storage
        .from('imoveis')
        .getPublicUrl(path)
        .data
        .publicUrl;


    const insert =
      await sb
        .from('imovel_fotos')
        .insert({

          imovel_id:
            propertyId,

          storage_path:
            path,

          url:
            publicUrl,

          ordem:
            order++

        })
        .select()
        .single();


    if (insert.error) {

      alert(
        'Registo da imagem: ' +
        insert.error.message
      );

      continue;

    }


    currentPhotos.push({

      id:
        insert.data.id,

      storage_path:
        path,

      url:
        publicUrl,

      ordem:
        order - 1

    });

  }


  if (currentPhotos.length) {

    await sb
      .from('imoveis')
      .update({
        imagem_capa:
          currentPhotos[0].url
      })
      .eq(
        'id',
        propertyId
      );

  } else {

    await sb
      .from('imoveis')
      .update({
        imagem_capa:null
      })
      .eq(
        'id',
        propertyId
      );

  }


  closeModal();

  loadProperties();

};


async function deleteProperty(id) {

  if (
    !confirm(
      'Eliminar este imóvel e todas as fotografias?'
    )
  ) {
    return;
  }


  const photos =
    await sb
      .from('imovel_fotos')
      .select('storage_path')
      .eq('imovel_id', id);


  if (photos.error) {

    alert(photos.error.message);

    return;

  }


  if (photos.data.length) {

    await sb
      .storage
      .from('imoveis')
      .remove(
        photos.data.map(
          function(photo) {

            return photo.storage_path;

          }
        )
      );

  }


  await sb
    .from('imovel_fotos')
    .delete()
    .eq(
      'imovel_id',
      id
    );


  const result =
    await sb
      .from('imoveis')
      .delete()
      .eq('id', id);


  if (result.error) {

    alert(result.error.message);

    return;

  }


  loadProperties();

}


init();

</script>

<body>

<main>


<section class="properties-page">

  >

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  'https://scmorocdbdyvnxodpwyi.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function esc(value) {

  return String(value ?? '')
    .replace(/[&<>"']/g, function(char) {

      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'

      }[char];

    });

}


function formatPrice(price) {

  if (!price) {
    return 'Preço sob consulta';
  }

  return new Intl.NumberFormat(
    'pt-PT',
    {
      style: 'currency',
      currency: 'EUR',
      maximumFractionDigits: 0
    }
  ).format(price);

}


function feature(icon, value, label) {

  if (
    value === null ||
    value === undefined ||
    value === '' ||
    value === false
  ) {
    return '';
  }

  return `

    <div class="detail-feature">

      <i class="${icon}"></i>

      <strong>
        ${esc(value)}
      </strong>

      <span>
        ${label}
      </span>

    </div>

  `;

}


async function loadProperties() {

  const result =
    await sb
      .from('imoveis')
      .select('*')
      .eq('publicado', true)
      .order('created_at', {
        ascending: false
      });


  const list =
    document.getElementById('propertyList');


  if (result.error) {

    list.innerHTML = `
      <div class="empty-state">
        Não foi possível carregar os imóveis.
      </div>
    `;

    return;
  }


  const properties =
    result.data || [];


  if (!properties.length) {

    list.innerHTML = `
      <div class="empty-state">
        De momento não existem imóveis publicados.
      </div>
    `;

    return;
  }


  list.innerHTML = `

    <div class="properties-list">

      ${
        properties.map(function(property) {

          return `

            <article class="property-list-card">

              <a
                href="imoveis.html?id=${encodeURIComponent(property.id)}"
                class="property-list-image"
              >

                ${
                  property.imagem_capa
                  ?
                  `<img
                    src="${esc(property.imagem_capa)}"
                    alt="${esc(property.titulo)}"
                    loading="lazy"
                  >`
                  :
                  `<div class="property-placeholder">
                    <i class="fa-solid fa-house"></i>
                    Sem fotografia
                  </div>`
                }

              </a>


              <div class="property-list-info">

                <span class="property-status">
                  ${esc(property.estado || 'Disponível')}
                </span>

                ${
                  property.luxo
                  ?
                  `<span class="luxury-badge">
                    <i class="fa-solid fa-gem"></i>
                    LUXO
                  </span>`
                  : ''
                }

                <h2>
                  ${esc(property.titulo)}
                </h2>

                <div class="property-location">
                  <i class="fa-solid fa-location-dot"></i>
                  ${esc(property.localizacao)}
                </div>

                <div class="property-list-price">
                  ${formatPrice(property.preco)}
                </div>


                <div class="property-mini-features">

                  ${
                    property.quartos != null
                    ?
                    `<span>
                      <i class="fa-solid fa-bed"></i>
                      ${property.quartos} quartos
                    </span>`
                    : ''
                  }

                  ${
                    property.casas_banho != null
                    ?
                    `<span>
                      <i class="fa-solid fa-bath"></i>
                      ${property.casas_banho} WC
                    </span>`
                    : ''
                  }

                  ${
                    property.area
                    ?
                    `<span>
                      <i class="fa-solid fa-ruler-combined"></i>
                      ${property.area} m²
                    </span>`
                    : ''
                  }

                  ${
                    property.garagem
                    ?
                    `<span>
                      <i class="fa-solid fa-car"></i>
                      Garagem
                    </span>`
                    : ''
                  }

                  ${
                    property.piscina
                    ?
                    `<span>
                      <i class="fa-solid fa-person-swimming"></i>
                      Piscina
                    </span>`
                    : ''
                  }

                </div>


                <a
                  href="imoveis.html?id=${encodeURIComponent(property.id)}"
                  class="property-link"
                >
                  Ver imóvel
                  <i class="fa-solid fa-arrow-right"></i>
                </a>

              </div>

            </article>

          `;

        }).join('')
      }

    </div>

  `;

}


async function loadPropertyDetail(id) {

  const list =
    document.getElementById('propertyList');

  const detail =
    document.getElementById('propertyDetail');


  const propertyResult =
    await sb
      .from('imoveis')
      .select('*')
      .eq('id', id)
      .eq('publicado', true)
      .single();


  if (propertyResult.error) {

    list.innerHTML = `
      <div class="empty-state">
        Imóvel não encontrado.
      </div>
    `;

    return;
  }


  const property =
    propertyResult.data;


  const photosResult =
    await sb
      .from('imovel_fotos')
      .select('*')
      .eq('imovel_id', id)
      .order('ordem', {
        ascending: true
      });


  const photos =
    photosResult.data || [];


  list.style.display = 'none';

  detail.style.display = 'block';


  detail.innerHTML = `

    <a
      href="imoveis.html"
      class="back-link"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Voltar aos imóveis
    </a>


    <article class="property-detail-card">


      <div class="property-slideshow">

        ${
          photos.length
          ?
          photos.map(function(photo, index) {

            return `

              <div
                class="slide ${index === 0 ? 'active' : ''}"
              >

                <img
                  src="${esc(photo.url)}"
                  alt="${esc(property.titulo)} - fotografia ${index + 1}"
                >

                <div class="fnai-watermark">
                  FNAI
                </div>

              </div>

            `;

          }).join('')
          :
          property.imagem_capa
          ?
          `
            <div class="slide active">

              <img
                src="${esc(property.imagem_capa)}"
                alt="${esc(property.titulo)}"
              >

              <div class="fnai-watermark">
                FNAI
              </div>

            </div>
          `
          :
          `
            <div class="slide active">

              <div class="property-placeholder">
                <i class="fa-solid fa-house"></i>
                Sem fotografia
              </div>

            </div>
          `
        }


        ${
          photos.length > 1
          ?
          `

            <button
              type="button"
              class="slide-prev"
              aria-label="Fotografia anterior"
            >
              <i class="fa-solid fa-chevron-left"></i>
            </button>


            <button
              type="button"
              class="slide-next"
              aria-label="Fotografia seguinte"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </button>


            <div class="slide-dots"></div>

          `
          : ''
        }

      </div>


      <div class="property-detail-info">

        <div class="property-detail-top">

          <span class="property-status">
            ${esc(property.estado || 'Disponível')}
          </span>

          ${
            property.luxo
            ?
            `<span class="luxury-badge">
              <i class="fa-solid fa-gem"></i>
              IMÓVEL DE LUXO
            </span>`
            : ''
          }

        </div>


        <h1>
          ${esc(property.titulo)}
        </h1>


        <div class="property-location property-location-large">

          <i class="fa-solid fa-location-dot"></i>

          ${esc(property.localizacao)}

        </div>


        <div class="property-detail-price">
          ${formatPrice(property.preco)}
        </div>


        <div class="property-features">

          ${feature(
            'fa-solid fa-bed',
            property.quartos,
            'Quartos'
          )}

          ${feature(
            'fa-solid fa-bath',
            property.casas_banho,
            'WC'
          )}

          ${feature(
            'fa-solid fa-ruler-combined',
            property.area,
            'm²'
          )}

          ${
            property.garagem
            ?
            `
              <div class="detail-feature">

                <i class="fa-solid fa-car"></i>

                <strong>
                  <i class="fa-solid fa-check"></i>
                </strong>

                <span>
                  Garagem
                </span>

              </div>
            `
            : ''
          }


          ${
            property.piscina
            ?
            `
              <div class="detail-feature">

                <i class="fa-solid fa-person-swimming"></i>

                <strong>
                  <i class="fa-solid fa-check"></i>
                </strong>

                <span>
                  Piscina
                </span>

              </div>
            `
            : ''
          }

        </div>


        ${
          property.descricao
          ?
          `
            <div class="property-description">

              ${esc(property.descricao)
                .replace(/\n/g, '<br>')}

            </div>
          `
          : ''
        }


        ${
          property.fnai_url
          ?
          `
            <a
              href="${esc(property.fnai_url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="fnai-property-link"
            >

              <i class="fa-solid fa-arrow-up-right-from-square"></i>

              Ver anúncio na FNAI

            </a>
          `
          : ''
        }


        <a
          href="https://wa.me/41792601145"
          target="_blank"
          rel="noopener noreferrer"
          class="property-contact-button"
        >

          <i class="fa-brands fa-whatsapp"></i>

          Pedir informações pelo WhatsApp

        </a>

      </div>

    </article>

  `;


  if (photos.length > 1) {

    initSlideshow();

  }

}


function initSlideshow() {

  const slideshow =
    document.querySelector('.property-slideshow');

  if (!slideshow) {
    return;
  }


  const slides =
    slideshow.querySelectorAll('.slide');

  const previous =
    slideshow.querySelector('.slide-prev');

  const next =
    slideshow.querySelector('.slide-next');

  const dotsContainer =
    slideshow.querySelector('.slide-dots');


  if (slides.length <= 1) {
    return;
  }


  let current = 0;

  let timer;


  slides.forEach(function(_, index) {

    const dot =
      document.createElement('button');

    dot.type = 'button';

    dot.className =
      'slide-dot';

    dot.setAttribute(
      'aria-label',
      `Fotografia ${index + 1}`
    );


    if (index === 0) {
      dot.classList.add('active');
    }


    dot.addEventListener(
      'click',
      function() {

        show(index);

        restart();

      }
    );


    dotsContainer.appendChild(dot);

  });


  const dots =
    dotsContainer.querySelectorAll('.slide-dot');


  function show(index) {

    current =
      (index + slides.length) %
      slides.length;


    slides.forEach(function(slide, i) {

      slide.classList.toggle(
        'active',
        i === current
      );

    });


    dots.forEach(function(dot, i) {

      dot.classList.toggle(
        'active',
        i === current
      );

    });

  }


  function restart() {

    clearInterval(timer);

    timer =
      setInterval(function() {

        show(current + 1);

      }, 5000);

  }


  previous.addEventListener(
    'click',
    function() {

      show(current - 1);

      restart();

    }
  );


  next.addEventListener(
    'click',
    function() {

      show(current + 1);

      restart();

    }
  );


  slideshow.addEventListener(
    'mouseenter',
    function() {

      clearInterval(timer);

    }
  );


  slideshow.addEventListener(
    'mouseleave',
    restart
  );


  restart();

}


const params =
  new URLSearchParams(
    window.location.search
  );


const propertyId =
  params.get('id');


if (propertyId) {

  loadPropertyDetail(propertyId);

} else {

  loadProperties();

}

</script>

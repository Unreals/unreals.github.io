<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos os Imóveis | Jo Torres</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    :root { --primary: #0c1b24; --gold: #c99b32; --bg-light: #f8f9fa; --white: #ffffff; }
    body { background-color: var(--white); color: #333; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 20px; }

    header { background-color: var(--primary); position: sticky; top: 0; z-index: 1000; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; height: 80px; }
    .logo { color: var(--white); font-size: 24px; font-weight: 700; }
    .logo span { color: var(--gold); }
    nav ul { display: flex; list-style: none; gap: 25px; }
    nav a { color: var(--white); font-size: 14px; font-weight: 500; }

    .page-header { background: var(--primary); color: white; padding: 40px 0; text-align: center; }
    .page-header h1 { font-size: 32px; font-weight: 700; }

    .section { padding: 50px 0; }
    .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }

    .property {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .property-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: #eee;
    }

    .property-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    /* FILIGRANA FNAI */
    .property-img-wrap::after {
      content: "FNAI";
      position: absolute;
      bottom: 8px;
      left: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 4;
    }

    .tag { background: #eee; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }

    .energy-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; color: #fff; }
    .energy-a-plus, .energy-a { background-color: #008752; }
    .energy-b { background-color: #71b32d; }
    .energy-c { background-color: #fcc015; color: #000; }

    .property-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .property-body h3 { font-size: 18px; margin: 8px 0 4px 0; color: var(--primary); }
    .prop-location { font-size: 13px; color: #666; margin-bottom: 12px; }

    .property-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .property-details span { display: flex; align-items: center; gap: 5px; }
    .property-details i { color: var(--gold); }

    footer { background-color: var(--primary); color: var(--white); text-align: center; padding: 30px 0; margin-top: 50px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">JO <span>TORRES</span></a>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="imoveis.html">Imóveis</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Catálogo de Imóveis</h1>
      <p style="color: var(--gold); margin-top: 5px;">Encontre o imóvel ideal para si</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="property-grid" id="catalogGrid">
        <!-- Renderizado via JavaScript -->
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Jo Torres - Consultoria Imobiliária. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    const properties = [
      {
        title: "Moradia Contemporânea T4",
        location: "Cascais, Lisboa",
        type: "Moradia",
        price: 850000,
        rooms: 4,
        baths: 3,
        area: 280,
        garage: "Sim",
        energy: "A",
        image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80"
      },
      {
        title: "Apartamento Moderno T2",
        location: "Parque das Nações, Lisboa",
        type: "Apartamento",
        price: 420000,
        rooms: 2,
        baths: 2,
        area: 105,
        garage: "Sim",
        energy: "B",
        image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80"
      },
      {
        title: "Moradia T3 com Piscina",
        location: "Vilamoura, Algarve",
        type: "Moradia",
        price: 690000,
        rooms: 3,
        baths: 3,
        area: 210,
        garage: "Sim",
        energy: "A+",
        image: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800&q=80"
      }
    ];

    function esc(str) { return String(str || '').replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function getEnergyBadge(rating) {
      if (!rating) return '';
      const r = String(rating).trim().toUpperCase();
      let css = 'energy-a';
      if (r === 'B') css = 'energy-b';
      if (r === 'C') css = 'energy-c';
      return `<span class="energy-badge ${css}">${r}</span>`;
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = properties.map(x => {
        const priceFormatted = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(x.price);
        
        return `
          <article class="property">
            <div class="property-img-wrap">
              <img src="${x.image}" alt="${esc(x.title)}">
            </div>
            <div class="property-body">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                <span class="tag">${esc(x.type)}</span>
                ${getEnergyBadge(x.energy)}
              </div>
              <h3>${esc(x.title)}</h3>
              <p class="prop-location"><i class="fa-solid fa-location-dot"></i> ${esc(x.location)}</p>

              <div class="property-details">
                ${x.rooms ? `<span><i class="fa-solid fa-bed"></i> T${x.rooms}</span>` : ''}
                ${x.baths ? `<span><i class="fa-solid fa-bath"></i> ${x.baths} WC</span>` : ''}
                ${x.area ? `<span><i class="fa-solid fa-ruler-combined"></i> ${x.area} m²</span>` : ''}
                ${x.garage ? `<span><i class="fa-solid fa-car"></i> Garagem</span>` : ''}
              </div>

              <strong style="font-size:20px; color:var(--primary); margin-top: auto;">${priceFormatted}</strong>
            </div>
          </article>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', renderCatalog);
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Catálogo completo de imóveis — Jo Torres">
<title>Imóveis | Jo Torres</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.property-img-wrap {
  position: relative !important;
  width: 100% !important;
  height: 220px !important;
  overflow: hidden !important;
  background-color: #000 !important;
  cursor: pointer !important;
}
.property-img-wrap img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  transition: transform 0.3s ease !important;
}
.property-img-wrap:hover img {
  transform: scale(1.03) !important;
}
.luxury-badge {
  position: absolute !important;
  top: 10px !important;
  left: 10px !important;
  background: rgba(12, 27, 36, 0.92) !important;
  color: #c99b32 !important;
  border: 1px solid #c99b32 !important;
  padding: 6px 12px !important;
  border-radius: 20px !important;
  font-size: 15px !important;
  font-weight: bold !important;
  display: flex !important;
  align-items: center !important;
  gap: 5px !important;
  z-index: 10 !important;
}
.gallery-btn {
  position: absolute !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  background: rgba(0,0,0,0.6) !important;
  color: #fff !important;
  border: none !important;
  border-radius: 50% !important;
  width: 32px !important;
  height: 32px !important;
  cursor: pointer !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  z-index: 5 !important;
}
.gallery-btn.prev { left: 8px !important; }
.gallery-btn.next { right: 8px !important; }
.img-counter {
  position: absolute !important;
  bottom: 8px !important;
  right: 8px !important;
  background: rgba(0,0,0,0.6) !important;
  color: #fff !important;
  font-size: 11px !important;
  padding: 3px 8px !important;
  border-radius: 12px !important;
  z-index: 5 !important;
}
.prop-location {
  color: #0c1b24 !important;
  font-size: 19px !important;
  font-weight: 700 !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  margin: 10px 0 14px 0 !important;
}
.prop-location i { color: #c99b32 !important; }
.lightbox {
  display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 9999;
  justify-content: center; align-items: center; padding: 20px;
}
.lightbox.show { display: flex; }
.lightbox-img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; }
</style>
</head>
<body>
<header class="header"><div class="container nav">
<a class="brand" href="index.html"><span class="brand-mark">JT</span><span><strong>JO TORRES</strong><small>CONSULTOR IMOBILIÁRIO</small></span></a>
<button class="menu" aria-label="Menu">☰</button>
<nav><a href="index.html">Início</a><a href="imoveis.html">Imóveis</a><a href="index.html#contacto">Contacto</a></nav>
</div></header>

<main>
<section class="search-wrap" style="margin-top: 20px;"><div class="container search-box">
  <div><label>Zona / Localização</label><input id="qZone" placeholder="Famalicão, Lisboa, Porto..."></div>
  <div><label>Tipo</label><select id="qType"><option value="">Todos</option><option>Moradia</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option></select></div>
  <div><label>Preço máximo</label><select id="qPrice"><option value="">Sem limite</option><option value="300000">300.000 €</option><option value="500000">500.000 €</option><option value="750000">750.000 €</option><option value="1000000">1.000.000 €</option></select></div>
  <button class="btn gold" id="searchBtn">Pesquisar</button>
</div></section>

<section class="section"><div class="container">
  <h2>Todos os Imóveis</h2>
  <div class="cards" id="propertyGrid"></div>
  <div id="noResults" style="display:none; text-align:center; padding:40px 20px; font-size:16px;">
    Não encontrámos imóveis com esses critérios.
  </div>
</div></section>
</main>

<div id="lightbox" class="lightbox" onclick="closeLightbox()"><span class="lightbox-close">&times;</span><img id="lightbox-img" class="lightbox-img" src="" alt="Zoom"></div>

<script>
function normalizeText(str) {
  return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function applySearch() {
  const cards = [...document.querySelectorAll('.property')];
  const noResults = document.getElementById('noResults');
  const z = normalizeText(document.getElementById('qZone').value.trim());
  const t = document.getElementById('qType').value;
  const p = Number(document.getElementById('qPrice').value || Infinity);
  let count = 0;

  cards.forEach(c => {
    let searchContent = normalizeText(c.dataset.search || "");
    let type = c.dataset.type || "";
    let price = Number(c.dataset.price || 0);

    let matchZone = !z || searchContent.includes(z);
    let matchType = !t || type === t;
    let matchPrice = price <= p;

    let ok = matchZone && matchType && matchPrice;
    c.style.display = ok ? 'block' : 'none';
    if (ok) count++;
  });

  if (noResults) noResults.style.display = (count === 0) ? 'block' : 'none';
}

document.getElementById('qZone').addEventListener('input', applySearch);
document.getElementById('qType').addEventListener('change', applySearch);
document.getElementById('qPrice').addEventListener('change', applySearch);
document.getElementById('searchBtn').onclick = applySearch;

function esc(s) { return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

window.propertiesImageData = {};

function changeCardImage(event, propId, direction) {
  event.stopPropagation();
  const data = window.propertiesImageData[propId];
  if (!data || !data.images) return;
  data.currentIndex = (data.currentIndex + direction + data.images.length) % data.images.length;
  document.getElementById(`img-${propId}`).src = data.images[data.currentIndex];
  document.getElementById(`counter-${propId}`).innerText = `${data.currentIndex + 1}/${data.images.length}`;
}

function renderProperties(items) {
  const grid = document.getElementById('propertyGrid');
  if (!Array.isArray(items) || items.length === 0) return;

  grid.innerHTML = items.map((x, idx) => {
    let imgList = Array.isArray(x.images) && x.images.length ? x.images : (x.image ? [x.image] : ['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85']);
    window.propertiesImageData[idx] = { images: imgList, currentIndex: 0 };

    const priceVal = x.price || 0;
    const priceFormatted = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(priceVal);
    const title = esc(x.title || 'Imóvel');
    const location = esc(x.location || 'Portugal');
    const type = esc(x.type || 'Moradia');
    const searchableText = `${title} ${location} ${x.description || ''}`;

    return `
      <article class="property" data-search="${searchableText}" data-type="${type}" data-price="${priceVal}">
        <div class="property-img-wrap" onclick="openLightbox('${imgList[0]}')">
          <img id="img-${idx}" src="${imgList[0]}" alt="${title}">
          ${imgList.length > 1 ? `
            <button class="gallery-btn prev" onclick="changeCardImage(event, ${idx}, -1)">❮</button>
            <button class="gallery-btn next" onclick="changeCardImage(event, ${idx}, 1)">❯</button>
            <span class="img-counter" id="counter-${idx}">1/${imgList.length}</span>
          ` : ''}
        </div>
        <div class="property-body">
          <span class="tag">${type}</span>
          <h3>${title}</h3>
          <p class="prop-location"><i class="fa-solid fa-location-dot"></i> ${location}</p>
          <p class="prop-desc">${esc(x.description || '')}</p>
          <strong>${priceFormatted}</strong>
        </div>
      </article>
    `;
  }).join('');

  applySearch();
}

async function loadAll() {
  let loadedData = null;
  const local = localStorage.getItem("jt_properties") || localStorage.getItem("properties");
  if (local) {
    try { loadedData = JSON.parse(local); } catch(e){}
  }
  if (!loadedData) {
    try {
      const res = await fetch('properties.json?v=' + Date.now());
      if (res.ok) loadedData = await res.json();
    } catch(e){}
  }
  if (loadedData) renderProperties(loadedData);
}

loadAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis | Jo Torres</title>
  <meta name="description" content="Imóveis disponíveis para venda - Jo Torres, Consultor Imobiliário.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --ink:#07171b;
      --gold:#d3a72c;
      --cream:#f7f5ef;
      --white:#fff;
      --muted:#687376;
      --line:#e5e2da;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    .header{
      min-height:82px;padding:17px 5vw;background:var(--ink);color:#fff;
      display:flex;align-items:center;justify-content:space-between;gap:25px
    }
    .brand{display:flex;align-items:center;gap:12px}
    .mark{
      width:45px;height:45px;border:1px solid var(--gold);border-radius:50%;
      display:grid;place-items:center;color:var(--gold);font-weight:700
    }
    .brand strong{display:block;font-size:16px;letter-spacing:.08em}
    .brand span{display:block;color:var(--gold);font-size:10px;letter-spacing:.15em;margin-top:4px}
    .nav{display:flex;align-items:center;gap:22px;font-size:14px}
    .nav a:hover{color:var(--gold)}
    .hero{
      background:#0b2024;color:#fff;padding:80px 5vw 75px;
    }
    .hero-inner{width:min(1180px,92vw);margin:auto}
    .eyebrow{
      color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.18em;
      text-transform:uppercase;margin-bottom:13px
    }
    h1,h2,h3{font-family:"Playfair Display",Georgia,serif}
    h1{font-size:clamp(44px,6vw,76px);line-height:1;margin:0 0 18px}
    .hero p{max-width:650px;color:#c8d0d0;line-height:1.7;font-size:17px;margin:0}
    .main{width:min(1180px,92vw);margin:60px auto 100px}
    .toolbar{
      display:flex;justify-content:space-between;align-items:end;gap:20px;
      margin-bottom:30px
    }
    .toolbar h2{font-size:40px;margin:0}
    .count{color:var(--muted);font-size:14px}
    .grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px
    }
    .card{
      background:#fff;border:1px solid var(--line);overflow:hidden;
      transition:transform .2s ease,box-shadow .2s ease
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(7,23,27,.12)}
    .card-image{
      position:relative;width:100%;height:280px;background:#e8e7e2;overflow:hidden
    }
    .card-image img{
      width:100%;height:100%;display:block;object-fit:cover
    }
    .status{
      position:absolute;left:15px;top:15px;background:var(--gold);color:#101719;
      padding:7px 10px;font-size:10px;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase
    }
    .card-body{padding:23px}
    .type{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--gold);text-transform:uppercase}
    .card h3{font-size:27px;line-height:1.12;margin:9px 0 9px}
    .location{font-size:14px;color:var(--muted);min-height:20px}
    .meta{display:flex;flex-wrap:wrap;gap:13px;color:#596466;font-size:13px;margin:17px 0}
    .price{font-size:22px;font-weight:700;margin-top:18px}
    .button{
      display:inline-flex;align-items:center;justify-content:center;
      width:100%;margin-top:18px;background:var(--ink);color:#fff;
      padding:13px 17px;font-size:13px;font-weight:600
    }
    .button:hover{background:#173238}
    .empty,.error,.loading{
      background:#fff;border:1px solid var(--line);padding:60px 25px;text-align:center
    }
    .empty h2,.error h2{font-size:34px;margin:0 0 10px}
    .empty p,.error p,.loading{color:var(--muted)}
    footer{
      background:var(--ink);color:#fff;padding:35px 5vw;text-align:center;
      font-size:12px;color:#aeb8b9
    }
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:650px){
      .header{padding:14px 4vw}.nav a:not(.home){display:none}
      .hero{padding:55px 4vw}.main{width:92vw;margin:38px auto 70px}
      .toolbar{display:block}.toolbar h2{font-size:34px;margin-bottom:7px}
      .grid{grid-template-columns:1fr}.card-image{height:250px}
    }
  </style>
</head>
<body>

<header class="header">
  <a class="brand" href="index.html">
    <div class="mark">JT</div>
    <div>
      <strong>JO TORRES</strong>
      <span>CONSULTOR IMOBILIÁRIO</span>
    </div>
  </a>

  <nav class="nav">
    <a class="home" href="index.html">Início</a>
    <a href="#lista">Imóveis</a>
    <a href="index.html#contacto">Contacto</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">SELEÇÃO IMOBILIÁRIA</div>
    <h1>Imóveis disponíveis</h1>
    <p>Conheça a seleção de imóveis disponíveis para venda e encontre a oportunidade certa para si.</p>
  </div>
</section>

<main class="main" id="lista">
  <div class="toolbar">
    <div>
      <div class="eyebrow">OFERTA ATUAL</div>
      <h2>Todos os imóveis</h2>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="properties" class="loading">A carregar imóveis...</div>
</main>

<footer>
  © 2026 Jo Torres · Consultor Imobiliário
</footer>

<script>
const SUPABASE_URL = "https://scmorocdbdyvnxodpwyi.supabase.co";
const SUPABASE_KEY = "sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM";
const STORAGE_BUCKET = "imoveis";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function money(v){
  if(v===null || v===undefined || v==="") return "Preço sob consulta";
  const n=Number(v);
  if(Number.isNaN(n)) return esc(v);
  return new Intl.NumberFormat("pt-PT",{
    style:"currency",currency:"EUR",maximumFractionDigits:0
  }).format(n);
}

function validImage(v){
  return typeof v==="string" && (
    /^https?:\/\//i.test(v) ||
    /^\/?[^ ]+\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(v)
  );
}

/*
  IMPORTANTE:
  Nesta página usamos SOMENTE a imagem_capa do próprio registo.
  Não percorremos todos os campos da tabela à procura de imagens.
  Assim uma fotografia de outro imóvel nunca é escolhida por engano.
*/
async function getCover(row){
  if(validImage(row.imagem_capa)) return row.imagem_capa;

  // Fallback: procura uma imagem chamada capa/cover no Storage
  // apenas dentro da pasta deste imóvel.
  try{
    const {data,error}=await db.storage.from(STORAGE_BUCKET).list(String(row.id),{
      limit:100,offset:0,sortBy:{column:"name",order:"asc"}
    });
    if(!error && data){
      const preferred=data.find(f=>/^(capa|cover|imagem-capa|imagem_capa)\.(jpg|jpeg|png|webp)$/i.test(f.name));
      const first=data.find(f=>/\.(jpg|jpeg|png|webp|gif)$/i.test(f.name));
      const file=preferred || first;
      if(file){
        const path=String(row.id)+"/"+file.name;
        const {data:pub}=db.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        return pub?.publicUrl || "";
      }
    }
  }catch(e){
    console.warn("Storage:",e);
  }
  return "";
}

async function loadProperties(){
  const box=document.getElementById("properties");

  const {data,error}=await db
    .from("imoveis")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    box.className="error";
    box.innerHTML="<div><h2>Não foi possível carregar os imóveis</h2><p>Verifique a ligação ao Supabase e as políticas da tabela.</p></div>";
    return;
  }

  const rows=(data || []).filter(row => {
    // Se houver campo publicado, só mostra os publicados.
    if(Object.prototype.hasOwnProperty.call(row,"publicado"))
      return row.publicado === true;
    return true;
  });

  document.getElementById("count").textContent =
    `${rows.length} ${rows.length===1 ? "imóvel" : "imóveis"}`;

  if(!rows.length){
    box.className="empty";
    box.innerHTML="<div><h2>Nenhum imóvel disponível</h2><p>De momento não existem imóveis publicados.</p></div>";
    return;
  }

  const cards=await Promise.all(rows.map(async row=>{
    const image=await getCover(row);

    const title=row.titulo || "Imóvel";
    const location=row.localizacao || row.localidade || row.cidade || "";
    const status=row.estado || "Disponível";
    const id=row.id;

    const meta=[];
    if(row.area) meta.push(esc(row.area)+" m²");
    if(row.quartos!==null && row.quartos!==undefined && row.quartos!=="")
      meta.push(esc(row.quartos)+" quartos");
    if(row.casas_banho!==null && row.casas_banho!==undefined && row.casas_banho!=="")
      meta.push(esc(row.casas_banho)+" WC");

    return `
      <article class="card">
        <div class="card-image">
          ${image
            ? `<img src="${esc(image)}" alt="${esc(title)}" loading="lazy">`
            : `<div style="height:100%;display:grid;place-items:center;color:#7b8586;font-size:13px">Sem fotografia</div>`
          }
          <span class="status">${esc(status)}</span>
        </div>

        <div class="card-body">
          <div class="type">${esc(row.tipo || "IMÓVEL")}</div>
          <h3>${esc(title)}</h3>
          <div class="location">${esc(location)}</div>

          ${meta.length ? `<div class="meta">${meta.map(x=>`<span>${x}</span>`).join("")}</div>` : ""}

          <div class="price">${money(row.preco)}</div>

          <a class="button" href="imovel.html?id=${encodeURIComponent(id)}">
            Ver imóvel →
          </a>
        </div>
      </article>
    `;
  }));

  box.className="grid";
  box.innerHTML=cards.join("");
}

loadProperties();
</script>

</body>
</html>
